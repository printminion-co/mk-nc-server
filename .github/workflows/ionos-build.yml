# Dev and release build: builds the server and every needed out-of-tree app from source, assembles and
# validates every flavor with the tool pinned by the checked-out branch (IONOS/tools), installs every archive
# fresh on SQLite and probes it (the smoke job: a failure blocks publishing), and publishes the archives
# with checksums and a build-provenance attestation: a dev build (from the tip of ionos-dev-v<nn>) as ONE
# GitHub pre-release on a new tag dev-v<base>.<n>, a release build (from a snapshot branch rc/ncw-v<nn>-<n>,
# started by ionos-snapshot.yml) as a GitHub release on the snapshot's existing annotated tag.
# The logic lives in .github/ionos/ionos-build-*.sh and ionos-smoke-*.sh (tested by ionos-build.test.sh
# and ionos-smoke.test.sh); see .github/ionos/ionos-build.md.
#
# WHY ONE FILE FOR ALL BUILDS: GitHub's run_number counts per workflow file, and the build number of
# every artifact (dev and release) is this run number: one counter, always increasing. A second workflow
# file for release builds would start a second counter. Kind `release` is therefore an input of this file;
# it is accepted only on a snapshot branch (rc/ncw-v<nn>-<n>, or rehearsal/ncw-v<nn>-<n> for a rehearsal, which
# is derived from the ref and is not an input). Release number, snapshot branch and scope are read from the
# snapshot's annotated tag by the plan job, never taken from an input.
#
# APP BUILD CACHE: built apps are kept in ONE folder of the GitHub Actions cache (see ionos-build.md, "Cache").
# The restore step uses a key prefix so the newest folder is found; ionos-build-apps.sh reuses an app only
# when its own key (app commit, recipe, Node, PHP, Composer major) and checksum match and builds the rest;
# the save step runs only when something was built or dropped. Release builds use the cache too (version.json
# cached_builds says what was used). Input no_cache: no restore, nothing reused, no save. The cache is only
# ever filled by this job (dev branch or snapshot branch, manual or scheduled), never by pull requests.
# The server build is not cached.
#
# NOTE: scheduled runs and manual runs only exist once this file is on the repository's DEFAULT
# branch, which a person switches to the dev branch (a separate settings ticket). Until then nothing
# here runs on its own.

name: IONOS build

on:
  schedule:
    - cron: '7 5 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Build kind: dev (from ionos-dev-v<nn>) or release (only from a snapshot branch rc/ncw-v<nn>-<n>; started by the IONOS snapshot workflow)'
        type: choice
        options: [dev, release]
        default: dev
      flavors:
        description: 'Comma separated flavors to build (default: every flavor of IONOS/flavors)'
        type: string
        default: ''
      force:
        description: 'Build although nothing changed since the last dev pre-release (scheduled runs skip then)'
        type: boolean
        default: false
      no_cache:
        description: 'Fully clean build: do not restore, ignore and do not save the app build cache (manual runs only)'
        type: boolean
        default: false
      smoke_break:
        description: 'Proof of the smoke gates: tamper with the archives before a smoke test, which must then fail and block publishing (manual runs only). missing-app, extra-app, wrong-mode, skip-enable and brand break the fresh-install test; removed-in-shipped and no-buildnumber break the upgrade tests'
        type: choice
        options: [none, missing-app, extra-app, wrong-mode, skip-enable, brand, removed-in-shipped, no-buildnumber]
        default: none

permissions:
  contents: read

concurrency:
  group: ionos-build
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      kind: ${{ steps.plan.outputs.kind }}
      line: ${{ steps.plan.outputs.line }}
      server_commit: ${{ steps.plan.outputs.server_commit }}
      flavors_commit: ${{ steps.plan.outputs.flavors_commit }}
      # release builds only: read from the annotation of the snapshot tag
      tag: ${{ steps.plan.outputs.tag }}
      base_release: ${{ steps.plan.outputs.base_release }}
      release_nr: ${{ steps.plan.outputs.release_nr }}
      snapshot_branch: ${{ steps.plan.outputs.snapshot_branch }}
      rehearsal: ${{ steps.plan.outputs.rehearsal }}
      scope: ${{ steps.plan.outputs.scope }}
      source_branch: ${{ steps.plan.outputs.source_branch }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
    steps:
      # The repository has about 7.6 GB of history: one commit, only the scripts. The submodule
      # entry (the flavors commit) is read from the commit itself.
      - name: Check out the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/ionos
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          KIND: ${{ inputs.kind || 'dev' }}
          FORCE: ${{ inputs.force }}
          FLAVORS: ${{ inputs.flavors }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: bash .github/ionos/ionos-build-plan.sh

  build:
    # Runs third-party app code (npm, composer): a read-only token and nothing else. The archives go to
    # the publish job as a workflow artifact.
    name: Build and validate
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Set the work folder
        run: |
          echo "WORK=$RUNNER_TEMP/ionos-build" >> "$GITHUB_ENV"
          echo "CACHE_DIR=$RUNNER_TEMP/ionos-app-cache" >> "$GITHUB_ENV"

      # the dev branch, or the snapshot branch of a release build
      - name: Check out the branch of the run
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Only 3rdparty and the flavors repository now; every app submodule is initialised later, and
      # only the ones the selected flavors need.
      - name: Check out 3rdparty and the flavors repository
        run: git submodule update --init --depth 1 -- 3rdparty IONOS

      - name: Set up Node.js for the server build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Build the server from source
        run: bash .github/ionos/ionos-build-server.sh

      - name: Set up Node.js 24 for the tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install the flavors tool
        working-directory: IONOS/tools
        run: npm ci --ignore-scripts

      - name: Resolve the flavors and select the apps
        env:
          FLAVORS: ${{ inputs.flavors }}
        run: bash .github/ionos/ionos-build-select.sh

      # The newest folder of built apps: the key matches no entry, restore-keys finds the newest one by its
      # prefix (the portable key prefix of ionos-cache-lib.sh). A miss is fine: everything is built.
      - name: Restore the app build cache
        if: inputs.no_cache != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ionos-app-cache
          key: ionos-app-build-v1-restore-only
          restore-keys: ionos-app-build-v1-

      - name: Build the out-of-tree apps from source
        id: apps
        env:
          NO_CACHE: ${{ inputs.no_cache }}
        run: bash .github/ionos/ionos-build-apps.sh

      # Only when an app was built or dropped (cache_save), under the key of the folder, a hash of all per-app
      # keys: an existing key is fine (the save then only logs a warning), and the cache is never overwritten.
      # A failed save never fails the build.
      - name: Save the app build cache
        if: steps.apps.outputs.cache_save == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ionos-app-cache
          key: ${{ steps.apps.outputs.cache_key }}

      - name: Assemble the clean tree
        run: bash .github/ionos/ionos-build-assemble.sh

      - name: Build and validate every flavor
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          LINE: ${{ needs.plan.outputs.line }}
          SERVER_COMMIT: ${{ needs.plan.outputs.server_commit }}
          FLAVORS_COMMIT: ${{ needs.plan.outputs.flavors_commit }}
          KIND: ${{ needs.plan.outputs.kind }}
          SNAPSHOT_BASE: ${{ needs.plan.outputs.base_release }}
          SNAPSHOT_BRANCH: ${{ needs.plan.outputs.snapshot_branch }}
          RELEASE_NR: ${{ needs.plan.outputs.release_nr }}
          RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
        run: bash .github/ionos/ionos-build-package.sh

      - name: Hand the archives over to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ionos-build
          path: |
            ${{ runner.temp }}/ionos-build/out
            ${{ runner.temp }}/ionos-build/flavors.txt
            ${{ runner.temp }}/ionos-build/validated
            ${{ runner.temp }}/ionos-build/scope
            ${{ runner.temp }}/ionos-build/base-release
          if-no-files-found: error
          retention-days: 3

  smoke:
    # Installs every archive on SQLite and probes it. Runs app code from the archives (php occ, cron.php and a
    # web server on localhost): a read-only token and nothing else. Any failure fails this job, and publish
    # needs it, so nothing is published. The logs are kept as a workflow artifact, also after a failure.
    name: Fresh-install smoke test
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # only a manual run can set smoke_break; scheduled runs always get none
      SMOKE_BREAK: ${{ inputs.smoke_break || 'none' }}
    steps:
      - name: Set the work folder
        run: echo "WORK=$RUNNER_TEMP/ionos-build" >> "$GITHUB_ENV"

      # Only the scripts and the flavors repository (for `ncw resolve`), not the 7 GB server tree.
      - name: Check out the scripts and the flavors repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/ionos
            IONOS
          persist-credentials: false

      - name: Check out the flavors repository
        run: git submodule update --init --depth 1 -- IONOS

      - name: Set up Node.js 24 for the tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install the flavors tool
        working-directory: IONOS/tools
        run: npm ci --ignore-scripts

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ionos-build
          path: ${{ runner.temp }}/ionos-build

      # Gate proof (manual runs only): the smoke test below must fail, and publish must be skipped.
      - name: Tamper with the archives (smoke_break)
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_break != 'none'
        env:
          SMOKE_BREAK_JOB: fresh
        run: bash .github/ionos/ionos-smoke-break.sh "$SMOKE_BREAK" "$WORK"/out/*.zip

      - name: Install every archive and probe it
        run: bash .github/ionos/ionos-smoke-run.sh

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ionos-smoke-logs
          path: ${{ runner.temp }}/ionos-build/smoke-logs
          if-no-files-found: ignore
          retention-days: 14

  upgrade-smoke-sqlite:
    # Installs the vanilla OFFICIAL archive of the base release, upgrades it to every flavor archive the way
    # 05-deployment.md says and runs the checks of the fresh-install smoke test (ionos-smoke-upgrade.sh). Runs app
    # code from the archives (php occ, cron.php, a web server on localhost): a read-only token and nothing else.
    # The logs are kept as a workflow artifact, also after a failure. `publish` waits for the gate job.
    name: Upgrade smoke test (SQLite)
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # only a manual run can set smoke_break; scheduled runs always get none
      SMOKE_BREAK: ${{ inputs.smoke_break || 'none' }}
      SMOKE_DB: sqlite
    steps:
      - name: Set the work folder
        run: echo "WORK=$RUNNER_TEMP/ionos-build" >> "$GITHUB_ENV"

      # Only the scripts and the flavors repository (for `ncw resolve`), not the 7 GB server tree.
      - name: Check out the scripts and the flavors repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/ionos
            IONOS
          persist-credentials: false

      - name: Check out the flavors repository
        run: git submodule update --init --depth 1 -- IONOS

      - name: Set up Node.js 24 for the tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install the flavors tool
        working-directory: IONOS/tools
        run: npm ci --ignore-scripts

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ionos-build
          path: ${{ runner.temp }}/ionos-build

      # The official archive of the base release, checked against its sha256 and its signature.
      - name: Download and verify the vanilla official archive
        run: |
          bash .github/ionos/ionos-smoke-vanilla.sh "$(cat "$WORK/base-release")" "$RUNNER_TEMP/ionos-vanilla"
          echo "VANILLA_ZIP=$RUNNER_TEMP/ionos-vanilla/nextcloud-$(cat "$WORK/base-release").zip" >> "$GITHUB_ENV"

      # Gate proof (manual runs only): the upgrade smoke test below must fail, and publish must be skipped.
      - name: Tamper with the archives (smoke_break)
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_break != 'none'
        env:
          SMOKE_BREAK_JOB: upgrade
        run: bash .github/ionos/ionos-smoke-break.sh "$SMOKE_BREAK" "$WORK"/out/*.zip

      - name: Upgrade the vanilla release to every archive and probe it
        run: bash .github/ionos/ionos-smoke-upgrade.sh

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ionos-upgrade-smoke-logs-sqlite
          path: ${{ runner.temp }}/ionos-build/upgrade-logs-sqlite
          if-no-files-found: ignore
          retention-days: 14

  upgrade-smoke-mariadb:
    # Installs the vanilla OFFICIAL archive of the base release, upgrades it to every flavor archive the way
    # 05-deployment.md says and runs the checks of the fresh-install smoke test (ionos-smoke-upgrade.sh). Runs app
    # code from the archives (php occ, cron.php, a web server on localhost): a read-only token and nothing else.
    # The logs are kept as a workflow artifact, also after a failure. `publish` waits for the gate job.
    name: Upgrade smoke test (MariaDB, release builds)
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.kind == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # only a manual run can set smoke_break; scheduled runs always get none
      SMOKE_BREAK: ${{ inputs.smoke_break || 'none' }}
      SMOKE_DB: mariadb
    services:
      # THE MariaDB version of the release upgrade test, in one place: change the tag and digest here, or set the
      # repository variable IONOS_MARIADB_IMAGE to try another one without a commit. 10.11 is the oldest LTS that
      # Nextcloud 33 supports (10.11 / 11.4 / 11.8 / 12.3); the real production version is not known, see ionos-build.md.
      mariadb:
        image: ${{ vars.IONOS_MARIADB_IMAGE || 'mariadb:10.11.19@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7' }}
        env:
          MARIADB_ROOT_PASSWORD: smoke-root-password
          MARIADB_DATABASE: ncw_smoke
          MARIADB_USER: ncw_smoke
          MARIADB_PASSWORD: smoke-user-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Set the work folder
        run: echo "WORK=$RUNNER_TEMP/ionos-build" >> "$GITHUB_ENV"

      # Only the scripts and the flavors repository (for `ncw resolve`), not the 7 GB server tree.
      - name: Check out the scripts and the flavors repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/ionos
            IONOS
          persist-credentials: false

      - name: Check out the flavors repository
        run: git submodule update --init --depth 1 -- IONOS

      - name: Set up Node.js 24 for the tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install the flavors tool
        working-directory: IONOS/tools
        run: npm ci --ignore-scripts

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ionos-build
          path: ${{ runner.temp }}/ionos-build

      # The official archive of the base release, checked against its sha256 and its signature.
      - name: Download and verify the vanilla official archive
        run: |
          bash .github/ionos/ionos-smoke-vanilla.sh "$(cat "$WORK/base-release")" "$RUNNER_TEMP/ionos-vanilla"
          echo "VANILLA_ZIP=$RUNNER_TEMP/ionos-vanilla/nextcloud-$(cat "$WORK/base-release").zip" >> "$GITHUB_ENV"

      # Gate proof (manual runs only): the upgrade smoke test below must fail, and publish must be skipped.
      - name: Tamper with the archives (smoke_break)
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_break != 'none'
        env:
          SMOKE_BREAK_JOB: upgrade
        run: bash .github/ionos/ionos-smoke-break.sh "$SMOKE_BREAK" "$WORK"/out/*.zip

      - name: Upgrade the vanilla release to every archive and probe it
        env:
          SMOKE_DB_HOST: 127.0.0.1
          SMOKE_DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
          SMOKE_DB_USER: ncw_smoke
          SMOKE_DB_PASS: smoke-user-password
          SMOKE_DB_ROOT_PASS: smoke-root-password
        run: bash .github/ionos/ionos-smoke-upgrade.sh

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ionos-upgrade-smoke-logs-mariadb
          path: ${{ runner.temp }}/ionos-build/upgrade-logs-mariadb
          if-no-files-found: ignore
          retention-days: 14

  gate:
    # Decides from the results of the jobs before it whether publish may run (ionos-build-gate.sh, tested in
    # ionos-smoke.test.sh). It runs whatever happened before (`always()`), because a skipped MariaDB job is right for a
    # dev build and wrong for a release build, and that is not an `if:` a job-level condition can express safely.
    # It fails when a required job did not succeed, so publish (which needs it) is skipped.
    name: Gate for publishing
    needs: [plan, build, smoke, upgrade-smoke-sqlite, upgrade-smoke-mariadb]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BUILD: ${{ needs.plan.outputs.build }}
      KIND: ${{ needs.plan.outputs.kind }}
      PLAN_RESULT: ${{ needs.plan.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      UPGRADE_SQLITE_RESULT: ${{ needs.upgrade-smoke-sqlite.result }}
      UPGRADE_MARIADB_RESULT: ${{ needs.upgrade-smoke-mariadb.result }}
    steps:
      - name: Check out the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/ionos
          persist-credentials: false

      - name: Decide
        run: bash .github/ionos/ionos-build-gate.sh

  publish:
    # Runs no app code at all: only the scripts of this repository and the archives of the build job.
    name: Attest, publish and prune
    # `gate` fails unless every required test succeeded (the MariaDB one only for release builds). A job that needs
    # a skipped job anywhere upstream (the MariaDB job is skipped on dev builds) is skipped too unless its condition
    # has a status function, so this one names the three results it needs and starts with `!cancelled()`: it
    # publishes only when plan, build and the gate all succeeded, whatever was skipped before the gate.
    needs: [plan, build, gate]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      BUILD_NUMBER: ${{ github.run_number }}
      SERVER_COMMIT: ${{ needs.plan.outputs.server_commit }}
      FLAVORS_COMMIT: ${{ needs.plan.outputs.flavors_commit }}
      KIND: ${{ needs.plan.outputs.kind }}
      SNAPSHOT_TAG: ${{ needs.plan.outputs.tag }}
      SNAPSHOT_BASE: ${{ needs.plan.outputs.base_release }}
      SNAPSHOT_BRANCH: ${{ needs.plan.outputs.snapshot_branch }}
      RELEASE_NR: ${{ needs.plan.outputs.release_nr }}
      REHEARSAL: ${{ needs.plan.outputs.rehearsal }}
      RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
      SOURCE_BRANCH: ${{ needs.plan.outputs.source_branch }}
      SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Set the work folder
        run: echo "WORK=$RUNNER_TEMP/ionos-build" >> "$GITHUB_ENV"

      - name: Check out the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/ionos
          persist-credentials: false

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ionos-build
          path: ${{ runner.temp }}/ionos-build

      # Only archives that pass this gate are attested.
      - name: Check the archives
        run: bash .github/ionos/ionos-build-publish.sh --check

      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/ionos-build/out/*.zip

      - name: Keep the attestation next to the archives
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$WORK/out/ncw-build-$BUILD_NUMBER.attestation.jsonl"

      # a dev build: a pre-release on a new tag; a release build: a release on the existing snapshot tag
      - name: Publish the release or pre-release
        run: bash .github/ionos/ionos-build-publish.sh

      # release builds never prune anything
      - name: Prune old dev pre-releases
        if: needs.plan.outputs.kind == 'dev'
        run: bash .github/ionos/ionos-build-retain.sh
