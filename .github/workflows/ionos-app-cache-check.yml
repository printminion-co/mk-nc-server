# Weekly check of the app build cache: restores the cache folder of ionos-build.yml, rebuilds every pinned app
# (all app folders apps-*) WITHOUT the cache with the same build logic, compares each rebuilt tree's checksum
# with the cached one of the same key, and opens ONE issue when any differs (a comment on the open issue
# when it exists already). No mismatch: no issue, only the job summary. Apps that are not in the cache are
# skipped. The cache is never written here.
# The logic lives in .github/ionos/ionos-cache-check*.sh (tested by ionos-build.test.sh); see
# .github/ionos/ionos-build.md, "Cache".
#
# Two jobs, so that app code (npm, composer) never meets a token that can write: `check` has a read-only
# token; only `report`, which runs no app code, may write issues.
#
# NOTE: scheduled runs only exist once this file is on the repository's DEFAULT branch (see ionos-build.yml).
# The default branch is also where the cache of the scheduled builds lives, which this job can read.

name: IONOS app cache check

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-app-cache-check
  cancel-in-progress: false

jobs:
  check:
    name: Rebuild apps and compare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      mismatch: ${{ steps.compare.outputs.mismatch }}
    steps:
      - name: Set the folders
        run: |
          echo "WORK=$RUNNER_TEMP/ionos-cache-check" >> "$GITHUB_ENV"
          echo "CACHE_DIR=$RUNNER_TEMP/ionos-app-cache" >> "$GITHUB_ENV"

      - name: Check out the branch of the run
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # the app submodules are initialised by the build script, one by one
      - name: Set up Node.js 24 as the build does
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Restore the app build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ionos-app-cache
          key: ionos-app-build-v1-restore-only
          restore-keys: ionos-app-build-v1-

      - name: Rebuild every cached app without the cache and compare
        id: compare
        env:
          REPORT: ${{ runner.temp }}/ionos-cache-check/report.md
        run: bash .github/ionos/ionos-cache-check.sh

      - name: Hand the report over
        if: steps.compare.outputs.mismatch == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ionos-cache-check-report
          path: ${{ runner.temp }}/ionos-cache-check/report.md
          if-no-files-found: error
          retention-days: 7

  report:
    # Runs no app code: only this repository's script and the report of the check job.
    name: Open or update the issue
    needs: check
    if: needs.check.outputs.mismatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/ionos
          persist-credentials: false

      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ionos-cache-check-report
          path: ${{ runner.temp }}/report

      - name: Open the issue or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPORT: ${{ runner.temp }}/report/report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/ionos/ionos-cache-check-issue.sh
